[package]
name = "cscp-connector"
version = "0.2.0"
edition = "2021"
authors = ["Aditya <aditya@cscp.ai>"]
description = "Control-System-Context-Protocol: Universal Zero-Copy C-ABI Shared Memory Data Plane for Robotics & RL"
license = "Apache-2.0"
repository = "https://github.com/aditya/Control-System-Context-Protocol"
readme = "README.md"
keywords = ["robotics", "rl", "ipc", "shared-memory", "c-abi"]
categories = ["hardware-support", "science", "concurrency"]

[lib]
name = "cscp_connector"
crate-type = ["cdylib", "staticlib", "rlib"]

[[bin]]
name = "cscp_daemon"
path = "src/bin/cscp_daemon.rs"

[dependencies]
thiserror = "1.0"
libc = "0.2"
pyo3 = { version = "0.20", features = ["extension-module", "abi3-py37"], optional = true }
clap = { version = "4.4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = "0.3"

[features]
default = []
python = ["dep:pyo3"]

[build-dependencies]
cbindgen = { version = "0.26", optional = true }
